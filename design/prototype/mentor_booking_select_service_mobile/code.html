<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TradeMind - Select Service</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed-dim": "#3cddc7",
                      "surface-container-highest": "#34343d",
                      "outline-variant": "#454652",
                      "on-primary": "#121f8b",
                      "surface-container-low": "#1b1b23",
                      "tertiary-fixed-dim": "#ffb955",
                      "on-surface": "#e4e1ed",
                      "primary": "#bdc2ff",
                      "on-primary-fixed-variant": "#2e3aa2",
                      "tertiary-fixed": "#ffddb4",
                      "inverse-surface": "#e4e1ed",
                      "on-background": "#e4e1ed",
                      "surface-tint": "#bdc2ff",
                      "background": "#13131b",
                      "on-error": "#690005",
                      "inverse-primary": "#4854bb",
                      "on-tertiary-fixed-variant": "#633f00",
                      "secondary": "#44e2cd",
                      "tertiary": "#ffb955",
                      "surface-container-lowest": "#0d0d15",
                      "surface-container-high": "#292932",
                      "primary-container": "#5e6ad2",
                      "on-tertiary-container": "#fffaf9",
                      "on-secondary-fixed": "#00201c",
                      "on-tertiary": "#452b00",
                      "error-container": "#93000a",
                      "on-secondary-fixed-variant": "#005047",
                      "on-primary-fixed": "#000965",
                      "on-tertiary-fixed": "#291800",
                      "surface-dim": "#13131b",
                      "secondary-container": "#03c6b2",
                      "on-error-container": "#ffdad6",
                      "tertiary-container": "#a06800",
                      "inverse-on-surface": "#302f38",
                      "primary-fixed": "#dfe0ff",
                      "surface-variant": "#34343d",
                      "surface-bright": "#393841",
                      "surface": "#13131b",
                      "on-secondary-container": "#004d44",
                      "on-primary-container": "#fdfaff",
                      "error": "#ffb4ab",
                      "on-surface-variant": "#c6c5d5",
                      "surface-container": "#1f1f27",
                      "secondary-fixed": "#62fae3",
                      "outline": "#908f9e",
                      "on-secondary": "#003731",
                      "primary-fixed-dim": "#bdc2ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "lg": "24px",
                      "xl": "40px",
                      "margin-safe": "32px",
                      "xs": "4px",
                      "sm": "8px",
                      "md": "16px",
                      "gutter": "20px",
                      "base": "4px"
              },
              "fontFamily": {
                      "body-base": [
                              "Inter"
                      ],
                      "label-caps": [
                              "Geist Mono"
                      ],
                      "headline-md": [
                              "Inter"
                      ],
                      "display-lg": [
                              "Inter"
                      ],
                      "data-tabular": [
                              "Geist Mono"
                      ],
                      "display-lg-mobile": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "body-base": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "letterSpacing": "0em",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "500"
                              }
                      ],
                      "display-lg": [
                              "48px",
                              {
                                      "lineHeight": "56px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "600"
                              }
                      ],
                      "data-tabular": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0em",
                                      "fontWeight": "500"
                              }
                      ],
                      "display-lg-mobile": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "600"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        /* Spring animations */
        .spring-hover {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .spring-hover:active {
            transform: scale(0.98);
        }

        /* Glass border highlight */
        .glass-edge {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Hidden scrollbar */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Aurora background blob */
        .aurora-blob {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(94, 106, 210, 0.05) 0%, rgba(19, 19, 27, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: pulse-blob 10s infinite alternate ease-in-out;
        }

        @keyframes pulse-blob {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -45%) scale(1.1); opacity: 0.8; }
        }

        .service-radio:checked + label {
            border-color: theme('colors.secondary');
            background-color: theme('colors.surface-container-low');
        }
        .service-radio:checked + label .check-icon {
            opacity: 1;
            transform: scale(1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col font-body-base pb-[100px] relative overflow-x-hidden md:hidden">
<!-- Background Layer -->
<div class="aurora-blob"></div>
<!-- Top Navigation / Header (Linear Intent, no global nav) -->
<header class="w-full px-md py-md z-50 flex items-center justify-between sticky top-0 bg-background/90 backdrop-blur-md glass-edge border-b border-outline-variant/10">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-lg">candlestick_chart</span>
<span class="font-headline-md text-headline-md font-bold tracking-tighter">TradeMind</span>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-md z-10 flex flex-col mt-md">
<!-- Progress Stepper (Compact) -->
<div class="mb-lg">
<div class="flex items-center justify-between mb-sm px-xs">
<span class="font-label-caps text-label-caps text-secondary">Step 1 of 4</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Select Service</span>
</div>
<div class="w-full h-[2px] bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary w-1/4 rounded-full"></div>
</div>
</div>
<!-- Header -->
<div class="mb-lg">
<h1 class="font-display-lg-mobile text-display-lg-mobile mb-xs">What's your focus today?</h1>
<p class="text-on-surface-variant text-body-base font-body-base">Select a track to tailor your terminal experience.</p>
</div>
<!-- Service Options (Stacked Cards) -->
<div class="flex flex-col gap-sm flex-1">
<!-- Option 1 -->
<div class="relative">
<input checked="" class="service-radio sr-only" id="service_algo" name="service_selection" type="radio"/>
<label class="block w-full bg-[#0A0A0F] border border-outline-variant/20 rounded-xl p-md spring-hover cursor-pointer relative overflow-hidden glass-edge" for="service_algo">
<div class="flex items-start gap-md relative z-10">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center border border-outline-variant/10 shrink-0">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">terminal</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-start mb-1">
<h3 class="font-body-base text-[18px] font-semibold text-on-surface">Algorithmic Design</h3>
<div class="w-6 h-6 rounded-full border border-outline-variant/30 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-[16px] opacity-0 scale-50 transition-all duration-300 check-icon">check</span>
</div>
</div>
<p class="font-body-base text-[14px] text-on-surface-variant leading-snug">Build and backtest automated quantitative strategies with high-density datasets.</p>
<div class="mt-sm flex gap-2">
<span class="px-2 py-1 rounded bg-primary-container/10 text-primary font-label-caps text-[10px] border border-primary-container/20">Python</span>
<span class="px-2 py-1 rounded bg-surface-container-high text-on-surface-variant font-label-caps text-[10px] border border-outline-variant/10">Backtesting</span>
</div>
</div>
</div>
<!-- Active background subtle glow -->
<div class="absolute inset-0 bg-gradient-to-br from-secondary/5 to-transparent opacity-0 transition-opacity duration-300"></div>
</label>
</div>
<!-- Option 2 -->
<div class="relative">
<input class="service-radio sr-only" id="service_mentor" name="service_selection" type="radio"/>
<label class="block w-full bg-[#0A0A0F] border border-outline-variant/20 rounded-xl p-md spring-hover cursor-pointer relative overflow-hidden glass-edge" for="service_mentor">
<div class="flex items-start gap-md relative z-10">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center border border-outline-variant/10 shrink-0">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-start mb-1">
<h3 class="font-body-base text-[18px] font-semibold text-on-surface">Mentorship Track</h3>
<div class="w-6 h-6 rounded-full border border-outline-variant/30 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-[16px] opacity-0 scale-50 transition-all duration-300 check-icon">check</span>
</div>
</div>
<p class="font-body-base text-[14px] text-on-surface-variant leading-snug">1-on-1 guidance from industry quants to refine your risk models and execution.</p>
<div class="mt-sm flex gap-2">
<span class="px-2 py-1 rounded bg-tertiary/10 text-tertiary font-label-caps text-[10px] border border-tertiary/20">Live Sync</span>
<span class="px-2 py-1 rounded bg-surface-container-high text-on-surface-variant font-label-caps text-[10px] border border-outline-variant/10">Review</span>
</div>
</div>
</div>
</label>
</div>
<!-- Option 3 -->
<div class="relative">
<input class="service-radio sr-only" id="service_data" name="service_selection" type="radio"/>
<label class="block w-full bg-[#0A0A0F] border border-outline-variant/20 rounded-xl p-md spring-hover cursor-pointer relative overflow-hidden glass-edge" for="service_data">
<div class="flex items-start gap-md relative z-10">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center border border-outline-variant/10 shrink-0">
<span class="material-symbols-outlined text-secondary-fixed-dim" style="font-variation-settings: 'FILL' 1;">database</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-start mb-1">
<h3 class="font-body-base text-[18px] font-semibold text-on-surface">Data API Access</h3>
<div class="w-6 h-6 rounded-full border border-outline-variant/30 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-[16px] opacity-0 scale-50 transition-all duration-300 check-icon">check</span>
</div>
</div>
<p class="font-body-base text-[14px] text-on-surface-variant leading-snug">Direct pipeline to L2 order book data and historical tick datasets.</p>
<div class="mt-sm flex gap-2">
<span class="px-2 py-1 rounded bg-secondary-fixed-dim/10 text-secondary-fixed-dim font-label-caps text-[10px] border border-secondary-fixed-dim/20">WebSocket</span>
<span class="px-2 py-1 rounded bg-surface-container-high text-on-surface-variant font-label-caps text-[10px] border border-outline-variant/10">REST API</span>
</div>
</div>
</div>
</label>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-md bg-background/90 backdrop-blur-xl border-t border-outline-variant/10 z-50 glass-edge">
<button class="w-full bg-primary-container text-on-primary-container font-body-base font-semibold py-3 px-4 rounded-[10px] flex items-center justify-center gap-2 spring-hover relative overflow-hidden group">
<span class="relative z-10">Continue</span>
<span class="material-symbols-outlined relative z-10 text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
<!-- Inner Glow Effect -->
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
</button>
</div>
</body></html>
