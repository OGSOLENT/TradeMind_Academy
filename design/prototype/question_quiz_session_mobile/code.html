<!-- TopAppBar -->

<button class="text-on-surface hover:opacity-80 transition-transform active:scale-95 duration-200 p-2 -ml-2 rounded-full">

<main class="flex-grow pt-20 px-md flex flex-col gap-xl">

</div>
<div class="flex justify-between items-center font-data-tabular text-data-tabular">
<span class="text-on-surface">4125.75</span>
<span class="text-on-surface-variant">12 x <span class="text-secondary font-bold">150</span></span>
<span class="text-secondary bg-secondary/10 px-2 py-0.5 rounded">+138</span>
</div>
<div class="flex justify-between items-center font-data-tabular text-data-tabular">
<span class="text-on-surface">4125.50</span>
<span class="text-on-surface-variant">4 x <span class="text-secondary font-bold">210</span></span>
<span class="text-secondary bg-secondary/10 px-2 py-0.5 rounded">+206</span>

<div class="flex justify-between items-center font-data-tabular text-data-tabular">
<span class="text-on-surface">4125.25</span>

<script>
        // Simple script to handle option selection visual state
        document.querySelectorAll('.option-button').forEach(button => {
            button.addEventListener('click', function() {
                // Remove active state from all
                document.querySelectorAll('.option-button').forEach(btn => {
                    btn.classList.remove('bg-surface-container', 'border-secondary/50', 'ring-1', 'ring-secondary/50');
                    const indicator = btn.querySelector('div');
                    indicator.classList.remove('bg-secondary', 'border-secondary', 'text-on-secondary');
                    indicator.classList.add('border-outline');
                    indicator.querySelector('span').classList.remove('text-on-secondary');
                    indicator.querySelector('span').classList.add('text-outline');
                });
                
                // Add active state to clicked
                this.classList.add('bg-surface-container', 'border-secondary/50', 'ring-1', 'ring-secondary/50');
                const indicator = this.querySelector('div');
                indicator.classList.remove('border-outline');
                indicator.classList.add('bg-secondary', 'border-secondary');
                indicator.querySelector('span').classList.remove('text-outline');
                indicator.querySelector('span').classList.add('text-on-secondary');
            });
        });
    </script>
