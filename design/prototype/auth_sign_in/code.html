<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TradeMind - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error-container": "#93000a",
                        "surface-container-high": "#292932",
                        "on-secondary": "#003731",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#454652",
                        "on-background": "#e4e1ed",
                        "primary-fixed": "#dfe0ff",
                        "on-secondary-container": "#004d44",
                        "surface-bright": "#393841",
                        "inverse-surface": "#e4e1ed",
                        "on-secondary-fixed": "#00201c",
                        "on-tertiary-fixed": "#291800",
                        "tertiary-container": "#a06800",
                        "outline": "#908f9e",
                        "inverse-on-surface": "#302f38",
                        "primary-fixed-dim": "#bdc2ff",
                        "surface-container": "#1f1f27",
                        "secondary": "#44e2cd",
                        "on-surface-variant": "#c6c5d5",
                        "surface-dim": "#13131b",
                        "error": "#ffb4ab",
                        "background": "#13131b",
                        "surface-tint": "#bdc2ff",
                        "secondary-container": "#03c6b2",
                        "surface-container-highest": "#34343d",
                        "on-tertiary-container": "#fffaf9",
                        "secondary-fixed-dim": "#3cddc7",
                        "tertiary-fixed-dim": "#ffb955",
                        "on-primary": "#121f8b",
                        "surface-container-lowest": "#0d0d15",
                        "on-primary-fixed-variant": "#2e3aa2",
                        "on-primary-fixed": "#000965",
                        "on-primary-container": "#fdfaff",
                        "primary": "#bdc2ff",
                        "surface-variant": "#34343d",
                        "surface-container-low": "#1b1b23",
                        "secondary-fixed": "#62fae3",
                        "primary-container": "#5e6ad2",
                        "surface": "#13131b",
                        "on-tertiary-fixed-variant": "#633f00",
                        "on-secondary-fixed-variant": "#005047",
                        "inverse-primary": "#4854bb",
                        "tertiary-fixed": "#ffddb4",
                        "on-tertiary": "#452b00",
                        "tertiary": "#ffb955",
                        "on-surface": "#e4e1ed",
                        "on-error": "#690005"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        xs: "4px",
                        base: "4px",
                        sm: "8px",
                        gutter: "20px",
                        xl: "40px",
                        md: "16px",
                        "margin-safe": "32px",
                        lg: "24px"
                    },
                    fontFamily: {
                        "label-caps": ["Geist Mono"],
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "data-tabular": ["Geist Mono"],
                        "body-base": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    fontSize: {
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "500" }],
                        "display-lg-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }],
                        "data-tabular": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "500" }],
                        "body-base": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #050507;
            color: #e4e1ed;
        }
        .glass-panel {
            background: rgba(16, 16, 24, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .text-gradient {
            background: linear-gradient(135deg, #e4e1ed 0%, #908f9e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-float:focus-within label,
        .input-float input:not(:placeholder-shown) + label {
            transform: translateY(-120%) scale(0.85);
            color: #bdc2ff;
        }
        .aurora-blob {
            position: absolute;
            background: #5e6ad2;
            filter: blur(80px);
            opacity: 0.05;
            border-radius: 50%;
            animation: float 20s infinite ease-in-out alternate;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -50px) scale(1.2); }
        }
        .stagger-1 { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
        .stagger-2 { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
        .stagger-3 { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
        .stagger-4 { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
        .stagger-5 { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .candlestick-anim {
            animation: growWick 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: bottom;
        }
        @keyframes growWick {
            from { transform: scaleY(0.2); }
            to { transform: scaleY(1); }
        }

        .btn-glow:hover {
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex overflow-hidden font-body-base text-body-base">
<!-- Background Aurora -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="aurora-blob w-[600px] h-[600px] top-[-100px] left-[-100px]"></div>
<div class="aurora-blob w-[800px] h-[800px] bottom-[-200px] right-[-200px]" style="animation-delay: -10s;"></div>
</div>
<!-- Left Pane: 3D Visualization -->
<div class="hidden lg:block lg:w-[55%] relative z-10 border-r border-white/5">
<div class="absolute inset-0 bg-gradient-to-r from-transparent to-background/80 z-10"></div>

<!-- Overlay Content -->
<div class="absolute inset-0 z-20 flex flex-col justify-end p-xl pb-margin-safe stagger-1">
<h2 class="font-display-lg text-display-lg text-gradient mb-md">Master the Market</h2>
<p class="text-on-surface-variant max-w-md">Join the elite quant training platform. Experience high-frequency data density with cognitive ease.</p>
</div>
</div>
<!-- Right Pane: Auth Card -->
<div class="w-full lg:w-[45%] flex items-center justify-center p-md relative z-10">
<div class="w-full max-w-[400px] glass-panel rounded-xl p-lg md:p-xl">
<!-- Brand Logo -->
<div class="flex items-center gap-sm mb-xl stagger-1">
<div class="relative h-6 w-4 flex flex-col items-center justify-center">
<div class="w-0.5 h-full bg-secondary candlestick-anim absolute"></div>
<div class="w-full h-3 bg-secondary relative z-10 rounded-sm"></div>
</div>
<span class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight">TradeMind</span>
</div>
<div class="mb-lg stagger-2">
<h1 class="font-headline-md text-headline-md font-bold mb-xs">Welcome back</h1>
<p class="text-on-surface-variant text-sm">Enter your credentials to access your terminal.</p>
</div>
<!-- Form -->
<form class="space-y-md stagger-3" onsubmit="event.preventDefault();">
<div class="relative input-float">
<input class="w-full bg-[#050507] border border-white/10 rounded-lg px-md py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors peer" id="email" placeholder=" " required="" type="email"/>
<label class="absolute left-md top-3 text-on-surface-variant transition-all pointer-events-none bg-[#050507] px-1" for="email">Email address</label>
</div>
<div class="relative input-float group">
<input class="w-full bg-[#050507] border border-white/10 rounded-lg px-md py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors peer" id="password" oninput="updateStrength(this.value)" placeholder=" " required="" type="password"/>
<label class="absolute left-md top-3 text-on-surface-variant transition-all pointer-events-none bg-[#050507] px-1" for="password">Password</label>
<!-- Password Strength -->
<div class="h-[2px] w-full bg-surface-container-high mt-2 rounded-full overflow-hidden opacity-0 group-focus-within:opacity-100 transition-opacity">
<div class="h-full bg-secondary w-0 transition-all duration-300" id="strength-bar"></div>
</div>
</div>
<div class="flex items-center justify-between text-sm">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded bg-[#050507] border-white/10 text-primary focus:ring-primary focus:ring-offset-0 focus:ring-offset-transparent" type="checkbox"/>
<span class="text-on-surface-variant">Remember me</span>
</label>
<a class="text-primary hover:text-primary-fixed transition-colors" href="#">Forgot password?</a>
</div>
<button class="w-full bg-primary-container text-white py-3 rounded-[10px] font-medium transition-all hover:bg-inverse-primary btn-glow active:scale-[0.98]" type="submit">
                    Sign In to Terminal
                </button>
</form>
<div class="my-lg flex items-center gap-md stagger-4">
<div class="h-px bg-white/10 flex-1"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">OR</span>
<div class="h-px bg-white/10 flex-1"></div>
</div>
<!-- Social & Magic Link -->
<div class="space-y-sm stagger-5">
<button class="w-full flex items-center justify-center gap-sm bg-surface-container text-on-surface py-3 rounded-lg border border-white/5 hover:bg-surface-container-high transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-lg">login</span>
                    Continue with Google
                </button>
<button class="w-full flex items-center justify-center gap-sm bg-transparent text-on-surface-variant py-3 rounded-lg border border-transparent hover:border-white/10 hover:text-on-surface transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-lg">magic_button</span>
                    Send Magic Link
                </button>
</div>
<div class="mt-xl text-center stagger-5">
<p class="text-xs text-outline font-label-caps text-label-caps">
                    By continuing, you agree to our <a class="text-secondary hover:underline" href="#">Terms</a> and <a class="text-secondary hover:underline" href="#">Privacy Policy</a>.
                </p>
</div>
</div>
</div>
<script>
        function updateStrength(val) {
            const bar = document.getElementById('strength-bar');
            let strength = 0;
            if (val.length > 5) strength += 33;
            if (val.length > 8) strength += 33;
            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength += 34;
            
            bar.style.width = strength + '%';
            
            if (strength < 40) {
                bar.style.backgroundColor = '#ffb4ab'; // error
            } else if (strength < 80) {
                bar.style.backgroundColor = '#ffb955'; // tertiary
            } else {
                bar.style.backgroundColor = '#44e2cd'; // secondary (teal)
            }
        }
    </script>
</body></html>
