name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Firebase Emulator Suite's demo configuration. These are not
# credentials: a project id starting "demo-" can only ever talk to local
# emulators, never to a real Firebase project, and the app refuses to use
# anything else while NEXT_PUBLIC_USE_FIREBASE_EMULATORS is set.
env:
  NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-trademind
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-trademind.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
  NEXT_PUBLIC_FIREBASE_APP_ID: demo-app-id
  NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"

jobs:
  # Lint, types, unit tests with the coverage floors enforced, production build.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  # The security rules and the learner-model write path, against a real
  # Firestore emulator. Until the September audit these never ran in CI.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  # Every browser journey against the emulators, on desktop and Pixel 7.
  # Before the audit the emulators were never started here, so eight of the
  # nine spec files skipped themselves and CI stayed green without testing
  # the adaptive loop at all.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:ci
      # A skipped journey must not pass silently again: fail if any did.
      - name: No journey skipped
        run: |
          if grep -q '"status": "skipped"' test-results/results.json 2>/dev/null; then
            echo "::error::Browser tests were skipped. Were the emulators up?"
            grep -o '"title": "[^"]*"' test-results/results.json | head -20
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
