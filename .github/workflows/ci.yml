name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-trademind
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-trademind.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
  NEXT_PUBLIC_FIREBASE_APP_ID: demo-app-id
  NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"

jobs:
  # Lint, types, unit tests with the coverage floors enforced, production build.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:ci
      - name: No journey skipped
        run: |
          node -e '
            const fs = require("fs");
            const f = "test-results/results.json";
            if (!fs.existsSync(f)) { console.error("::error::No Playwright report at " + f); process.exit(1); }
            const { stats } = JSON.parse(fs.readFileSync(f, "utf8"));
            console.log("journeys passed:", stats.expected, "skipped:", stats.skipped, "failed:", stats.unexpected, "flaky:", stats.flaky);
            if (stats.skipped > 0) { console.error("::error::" + stats.skipped + " journeys skipped. Were the emulators up?"); process.exit(1); }
            if (stats.expected < 1) { console.error("::error::No journeys ran."); process.exit(1); }
          '
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
